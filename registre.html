<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | سوق الفلاح</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body><header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">سوق <span>الفلاح</span></a>
        <a href="index.html" class="btn btn-outline">الرئيسية</a>
    </div>
</header><main class="container"><div class="form-container">

    <h2>انضم إلى سوق الفلاح 🌿</h2>

    <p style="text-align:center; margin-bottom:25px; color:#777;">
        أنشئ حسابك وابدأ رحلتك معنا.
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="fullName">الاسم الكامل</label>
            <input
                type="text"
                id="fullName"
                placeholder="أدخل اسمك الكامل"
                required
            >
        </div>

        <div class="form-group">
            <label for="role">نوع الحساب</label>
            <select id="role" required>
                <option value="">اختر نوع الحساب</option>
                <option value="buyer">مشتري</option>
                <option value="seller">فلاح / بائع</option>
            </select>
        </div>

        <div class="form-group">
            <label for="wilaya">الولاية</label>
            <select id="wilaya" required>
                <option value="">اختر ولايتك</option>
                <option>أدرار</option>
                <option>الشلف</option>
                <option>الأغواط</option>
                <option>أم البواقي</option>
                <option>باتنة</option>
                <option>بجاية</option>
                <option>بسكرة</option>
                <option>بشار</option>
                <option>البليدة</option>
                <option>البويرة</option>
                <option>تمنراست</option>
                <option>تبسة</option>
                <option>تلمسان</option>
                <option>تيارت</option>
                <option>تيزي وزو</option>
                <option>الجزائر</option>
                <option>الجلفة</option>
                <option>جيجل</option>
                <option>سطيف</option>
                <option>سعيدة</option>
                <option>سكيكدة</option>
                <option>سيدي بلعباس</option>
                <option>عنابة</option>
                <option>قالمة</option>
                <option>قسنطينة</option>
                <option>المدية</option>
                <option>مستغانم</option>
                <option>المسيلة</option>
                <option>معسكر</option>
                <option>ورقلة</option>
                <option>وهران</option>
                <option>البيض</option>
                <option>إليزي</option>
                <option>برج بوعريريج</option>
                <option>بومرداس</option>
                <option>الطارف</option>
                <option>تندوف</option>
                <option>تيسمسيلت</option>
                <option>الوادي</option>
                <option>خنشلة</option>
                <option>سوق أهراس</option>
                <option>تيبازة</option>
                <option>ميلة</option>
                <option>عين الدفلى</option>
                <option>النعامة</option>
                <option>عين تموشنت</option>
                <option>غرداية</option>
                <option>غليزان</option>
                <option>تيميمون</option>
                <option>برج باجي مختار</option>
                <option>أولاد جلال</option>
                <option>بني عباس</option>
                <option>عين صالح</option>
                <option>عين قزام</option>
                <option>تقرت</option>
                <option>جانت</option>
                <option>المغير</option>
                <option>المنيعة</option>
              </select>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="6 أحرف على الأقل"
                minlength="6"
                required
            >
        </div>

        <div id="authMessage" class="message"></div>

        <button type="submit" class="btn btn-primary">
            إنشاء حساب
        </button>

    </form>

    <div style="text-align:center; margin:20px 0;">
        <span style="color:#777;">أو</span>
    </div>

    <button id="googleRegister" class="btn btn-outline">
        التسجيل باستخدام Google
    </button>

    <p class="form-link">
        لديك حساب بالفعل؟
        <a href="login.html">تسجيل الدخول</a>
    </p>

</div>

</main><footer class="footer">
    <div class="container">
        <h3>سوق الفلاح 🌿</h3>
        <p>من أرض الجزائر إلى بيتك</p>
    </div>
</footer><script type="module" src="js/auth.js"></script></body>
</html>
