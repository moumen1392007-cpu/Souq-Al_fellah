<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر دورك | سوق الفلاح</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f7f1;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 30px 22px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            color: #246b42;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .role {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            border: 2px solid #e5eee7;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .role:hover {
            border-color: #287b49;
            background: #f5fbf6;
        }

        .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 10px;
        }

        .role strong {
            display: block;
            font-size: 20px;
            color: #246b42;
            margin-bottom: 7px;
        }

        .role small {
            color: #777;
            font-size: 14px;
        }

        #message {
            color: #c0392b;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>مرحباً بك في سوق الفلاح 🌱</h1>

        <p class="subtitle">
            كيف تريد استخدام المنصة؟
        </p>

        <button class="role" id="sellerButton">
            <span class="icon">🌾</span>
            <strong>أنا بائع</strong>
            <small>أريد عرض منتجاتي وبيعها</small>
        </button>

        <button class="role" id="buyerButton">
            <span class="icon">🛒</span>
            <strong>أنا مشتري</strong>
            <small>أريد تصفح المنتجات وشرائها</small>
        </button>

        <p id="message"></p>
    </main>

    <script type="module">
        import { auth, db } from "./js/firebase.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const message = document.getElementById("message");
        const sellerButton = document.getElementById("sellerButton");
        const buyerButton = document.getElementById("buyerButton");

        let currentUser = null;
        let busy = false;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("login.html");
                return;
            }

            currentUser = user;
        });

        async function chooseRole(role) {
            if (!currentUser || busy) return;

            busy = true;
            sellerButton.disabled = true;
            buyerButton.disabled = true;

            message.textContent = "جارٍ حفظ اختيارك...";

            try {
                const userRef = doc(db, "users", currentUser.uid);
                const userSnapshot = await getDoc(userRef);

                if (!userSnapshot.exists()) {
                    throw new Error("لم يتم العثور على بيانات الحساب.");
                }

                await updateDoc(userRef, {
                    role: role
                });

                window.location.replace(
                    role === "seller" ? "dashboard.html" : "index.html"
                );

            } catch (error) {
                console.error(error);
                message.textContent = "تعذر حفظ اختيارك. حاول مرة أخرى.";
                busy = false;
                sellerButton.disabled = false;
                buyerButton.disabled = false;
            }
        }

        sellerButton.addEventListener("click", () => {
            chooseRole("seller");
        });

        buyerButton.addEventListener("click", () => {
            chooseRole("buyer");
        });
    </script>

</body>
</html>
