<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | سوق الفلاح</title>
<link rel="stylesheet" href="css/style.css"><style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#edf7ee,#f8fbf6);
min-height:100vh;
display:flex;
flex-direction:column;
}
.header{background:#fff;padding:16px 5%;box-shadow:0 2px 12px #0000000a}
.navbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#245b36;text-decoration:none}
.logo span{color:#79a84a}
.home-link{color:#27633b;text-decoration:none;font-weight:bold}
.auth-main{flex:1;display:flex;justify-content:center;align-items:center;padding:35px 15px}
.auth-card{
width:100%;max-width:440px;background:#fff;padding:35px 28px;
border-radius:22px;box-shadow:0 12px 40px #245b3614;
}
.brand-icon{
width:65px;height:65px;border-radius:20px;background:#eaf5e8;
display:flex;align-items:center;justify-content:center;
font-size:34px;margin:0 auto 15px;
}
.auth-card h1{text-align:center;color:#234d31;font-size:25px;margin:10px 0}
.subtitle{text-align:center;color:#849087;font-size:14px;line-height:1.8;margin-bottom:25px}
.form-group{margin-bottom:17px}
.form-group label{display:block;margin-bottom:8px;color:#344c3a;font-weight:bold;font-size:14px}
.form-group input{
width:100%;padding:15px;border:1px solid #dce7dc;border-radius:12px;
background:#fbfdfb;font-size:15px;outline:none;transition:.2s;
}
.form-group input:focus{border-color:#4b985e;box-shadow:0 0 0 3px #4b985e18}
.main-btn{
width:100%;border:0;border-radius:12px;padding:15px;
background:#287443;color:white;font-size:16px;font-weight:bold;
cursor:pointer;transition:.2s;margin-top:8px;
}
.main-btn:hover{background:#1d5e35}
.google-btn{
width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
padding:14px;border:1px solid #dce5dc;border-radius:12px;
background:#fff;color:#333;font-size:15px;font-weight:bold;cursor:pointer;
transition:.2s;
}
.google-btn:hover{background:#f7faf7}
.google-btn svg{width:21px;height:21px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#a0aaa0;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;background:#e6ece6;flex:1}
.form-link{text-align:center;color:#778078;font-size:14px;margin-top:24px}
.form-link a{color:#287443;text-decoration:none;font-weight:bold}
.message{display:none;margin:12px 0;padding:11px;border-radius:9px;background:#f2f8f1;text-align:center;font-size:14px}
.footer{text-align:center;padding:18px;color:#89958a;font-size:13px}
@media(max-width:480px){
.auth-card{padding:28px 20px;border-radius:18px}
.auth-main{padding:22px 14px}
}
</style></head><body><header class="header">
<div class="navbar">
<a href="index.html" class="logo">سوق <span>الفلاح</span> 🌿</a>
<a href="index.html" class="home-link">الرئيسية</a>
</div>
</header><main class="auth-main">
<div class="auth-card"><div class="brand-icon">🌱</div><h1>مرحباً بعودتك!</h1>
<p class="subtitle">سجّل الدخول واكتشف المنتجات الفلاحية من مختلف ولايات الجزائر.</p><button type="button" id="googleLogin" class="google-btn">
<svg viewBox="0 0 48 48" aria-hidden="true">
<path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.1 24.5c0-1.6-.2-3.1-.5-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.5 6.9l7.3 5.7c4.3-4 6.9-9.9 6.9-17.1z"/>
<path fill="#FBBC05" d="M10.4 28.7c-.6-1.4-.9-3-.9-4.7s.3-3.3.9-4.7l-7.8-6.1C.9 16.7 0 20.2 0 24s.9 7.3 2.6 10.8l7.8-6.1z"/>
<path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.4l-7.3-5.7c-2 1.3-4.6 2.1-7.9 2.1-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 43 14.6 48 24 48z"/>
</svg>
المتابعة باستخدام Google
</button><div class="divider">أو باستخدام البريد الإلكتروني</div><form id="loginForm"><div class="form-group">
<label for="email">البريد الإلكتروني</label>
<input type="email" id="email" placeholder="example@email.com" required>
</div><div class="form-group">
<label for="password">كلمة المرور</label>
<input type="password" id="password" placeholder="أدخل كلمة المرور" required>
</div><div id="authMessage" class="message"></div><button type="submit" class="main-btn">تسجيل الدخول</button>

</form><p class="form-link">
ليس لديك حساب؟
<a href="register.html">إنشاء حساب جديد</a>
</p></div>
</main><footer class="footer">
سوق الفلاح 🌿 — من أرض الجزائر إلى بيتك
</footer><script type="module" src="js/auth.js"></script></body>
</html>
