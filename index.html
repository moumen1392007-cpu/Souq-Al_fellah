<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سوق الفلاح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#173d28;--field:#2f8a4c;--sprout:#8fcf6a;--wheat:#e2b84f;--soil:#7b5638;--bg:#eef3ec;--ink:#1d2b22;--mute:#6b7a70;--line:#dbe5d9}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.hide{display:none!important}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ترحيب: صفوف المحصول */
#welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:28px 22px 40px;
background:repeating-linear-gradient(172deg,#1d5a37 0 26px,#236b41 26px 52px),var(--deep);position:relative}
#welcome:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#173d2800 25%,#173d28f2 78%)}
#welcome>*{position:relative;max-width:460px;width:100%;margin-inline:auto}
#welcome h1{font-size:46px;font-weight:800;line-height:1.2}
#welcome p{opacity:.9;margin:10px 0 24px}
.btn{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:14px;font-weight:600;background:var(--wheat);color:var(--deep);width:100%}
.btn.alt{background:#ffffff22;color:#fff;margin-top:10px}
.btn.sm{width:auto;display:inline-flex;gap:6px;justify-content:center;padding:9px 16px;font-size:14px}
.btn:disabled{opacity:.5}
/* التطبيق */
header{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
header svg{color:var(--sprout)}
main{max-width:640px;margin:0 auto;padding:14px 12px 110px}
.view{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.view{animation:none}}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--sprout);color:var(--deep);display:grid;place-items:center;font-weight:800;flex:none}
.av.xl{width:96px;height:96px;font-size:36px;border:4px solid #fff}
.nm{font-weight:600;cursor:pointer}
.tag{font-size:11px;background:#e5f4d9;color:var(--field);padding:1px 8px;border-radius:99px;margin-inline-start:6px}
.tm{font-size:12px;color:var(--mute)}
.pn{font-weight:800;font-size:18px;margin-top:10px}
.pr{color:var(--soil);font-weight:800}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin-inline-start:6px;color:var(--mute)}
.img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-top:10px;background:var(--line)}
.acts{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.act{display:flex;align-items:center;gap:6px;background:none;color:var(--mute);padding:6px 10px;border-radius:10px}
.act.on{color:var(--field);background:#e5f4d9}.act.del{margin-inline-start:auto}
.cm{margin-top:10px}
.cm .b{background:var(--bg);border-radius:14px;padding:8px 12px;flex:1}
.cm .rp{margin-inline-start:44px}
.lk{background:none;color:var(--field);font-size:12px;padding:2px 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;margin-top:6px}
label{font-size:13px;color:var(--mute);display:block;margin-top:10px}
.send{display:flex;gap:6px;margin-top:10px}.send input{margin:0}
.send button{background:var(--field);color:#fff;border-radius:12px;padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chips button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 14px}
.chips button.on{background:var(--field);color:#fff;border-color:var(--field)}
.cover{height:110px;border-radius:18px 18px 0 0;background:repeating-linear-gradient(172deg,#1d5a37 0 18px,#2f8a4c 18px 36px)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));inset-inline:12px;max-width:420px;margin-inline:auto;background:#fff;border-radius:22px;box-shadow:0 8px 28px #173d2833;display:flex;justify-content:space-around;padding:6px}
nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 14px;border-radius:16px;transition:.2s}
nav button.on{color:#fff;background:var(--field)}
nav .add{background:var(--wheat);color:var(--deep);border-radius:50%;width:50px;height:50px;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px #0003}
#toast{position:fixed;top:70px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:9px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1}
@media(min-width:900px){main{padding-top:24px}}
</style>
</head>
<body>

<section id="welcome" class="hide">
  <h1>سوق الفلاح</h1>
  <p>من أرض الجزائر إلى بيتك. الفلاحون يعرضون محاصيلهم، والمشترون يطلبونها مباشرة.</p>
  <a class="btn" href="register.html">إنشاء حساب</a>
  <a class="btn alt" href="login.html">تسجيل الدخول</a>
</section>

<div id="app" class="hide">
  <header><svg viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19c3-6 6-8 10-10"/></svg>سوق الفلاح</header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="toast"></div>

<script type="module">
import {auth,db,storage} from "./js/firebase.js";
import {onAuthStateChanged,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,query,orderBy,limit,startAfter,where,writeBatch,increment,serverTimestamp}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {ref,uploadBytes,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const $=s=>document.querySelector(s), V=$("#view");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
 like:'<path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.2 6.5a2 2 0 0 1-2 1.7H7"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const CATS={vegetables:"الخضر",fruits:"الفواكه",grains:"الحبوب",other:"منتجات أخرى"};
let me=null,busy=false,cursor=null,corpus=[];

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800)}
function ago(ts){const s=ts?.toDate?(Date.now()-ts.toDate())/1000:0;if(s<60)return"الآن";if(s<3600)return`منذ ${Math.floor(s/60)} د`;if(s<86400)return`منذ ${Math.floor(s/3600)} س`;return`منذ ${Math.floor(s/86400)} يوم`}
async function guard(btn,fn){if(busy)return;busy=true;btn&&(btn.disabled=true);try{await fn()}catch(e){console.error(e);toast(navigator.onLine?"تعذّر تنفيذ العملية. حاول مجدداً.":"لا يوجد اتصال بالإنترنت.")}finally{busy=false;btn&&(btn.disabled=false)}}

// ملفات المستخدمين (الاسم والصورة تُقرأ دائماً من ملف المستخدم الحالي)
const cache=new Map();
const prof=uid=>{if(!cache.has(uid))cache.set(uid,getDoc(doc(db,"profiles",uid)).then(s=>s.exists()?s.data():{name:"مستخدم"}).catch(()=>({name:"مستخدم"})));return cache.get(uid)};
const av=(p,c="")=>p.photoURL?`<img class="av ${c}" src="${esc(p.photoURL)}" alt="" loading="lazy">`:`<span class="av ${c}">${esc((p.name||"م")[0])}</span>`;

async function loadMe(u){
  const [us,ps]=await Promise.all([getDoc(doc(db,"users",u.uid)),getDoc(doc(db,"profiles",u.uid))]);
  const a=us.exists()?us.data():{};
  if(a.roleChosen===false){location.replace("choose-role.html");return null}
  let p=ps.exists()?ps.data():null;
  if(!p){ // ترحيل حساب قديم: ملف عام بلا بريد
    p={uid:u.uid,name:a.displayName||a.name||u.displayName||"مستخدم",photoURL:a.photoURL||u.photoURL||"",role:a.role||"buyer",wilaya:a.wilaya||"",bio:"",createdAt:serverTimestamp()};
    await setDoc(doc(db,"profiles",u.uid),p);
  }
  cache.set(u.uid,Promise.resolve(p));
  return p;
}

onAuthStateChanged(auth,async u=>{
  if(!u){me=null;$("#app").classList.add("hide");$("#welcome").classList.remove("hide");return}
  try{me=await loadMe(u);if(!me)return}catch(e){console.error(e);toast("تعذّر تحميل حسابك");return}
  $("#welcome").classList.add("hide");$("#app").classList.remove("hide");route();
});

// ===== الصور =====
function shrink(file,max,q=.82){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",q)};im.onerror=no;im.src=URL.createObjectURL(file)})}
async function upload(file,path,max){const r=ref(storage,path);await uploadBytes(r,await shrink(file,max),{contentType:"image/jpeg"});return getDownloadURL(r)}

// ===== المنشورات =====
function postHTML(id,d){
  const price=d.price?`<span class="pr">${Number(d.price).toLocaleString("ar-DZ")} دج</span>${d.category?`<span class="chip">${CATS[d.category]||""}</span>`:""}`:"";
  return `<article class="card" data-id="${id}" data-owner="${esc(d.authorId)}">
   <div class="row"><span data-a="${esc(d.authorId)}" class="row"></span><span class="tm" style="margin-inline-start:auto">${ago(d.createdAt)}</span></div>
   ${d.name?`<div class="pn">${esc(d.name)}</div>`:""}${price?`<div>${price}</div>`:""}
   ${(d.content||d.description)?`<p style="margin-top:6px;white-space:pre-wrap">${esc(d.content||d.description)}</p>`:""}
   ${(d.imageURL)?`<img class="img" src="${esc(d.imageURL)}" alt="" loading="lazy">`:""}
   <div class="acts"><button class="act" data-do="like">${ic("like")}<b>${Math.max(0,d.likes||0)}</b></button>
   <button class="act" data-do="cm">${ic("chat")}<b>${Math.max(0,d.commentsCount||0)}</b></button>
   ${d.authorId===me.uid?`<button class="act del" data-do="del" aria-label="حذف">${ic("trash")}</button>`:""}</div>
   <div class="cms hide"></div></article>`;
}
async function hydrate(root){
  for(const el of root.querySelectorAll("[data-a]:not([data-ok])")){
    el.dataset.ok=1;const p=await prof(el.dataset.a);
    el.innerHTML=`<a href="#u/${el.dataset.a}" style="text-decoration:none">${av(p)}</a><span><span class="nm" data-go="${el.dataset.a}">${esc(p.name)}</span>${p.role==="seller"?'<span class="tag">بائع</span>':""}</span>`;
  }
  for(const c of root.querySelectorAll("article:not([data-lk])")){
    c.dataset.lk=1;getDoc(doc(db,"posts",c.dataset.id,"reactions",me.uid)).then(s=>s.exists()&&c.querySelector('[data-do=like]').classList.add("on")).catch(()=>{});
  }
}
function showPosts(box,list,append){
  const html=list.map(([id,d])=>postHTML(id,d)).join("");
  if(!append)box.innerHTML="";box.insertAdjacentHTML("beforeend",html||(append?"":'<div class="empty">لا توجد منشورات بعد.</div>'));hydrate(box);
}

// ===== الأحداث (تفويض) =====
V.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){location.hash="u/"+g.dataset.go;return}
  const b=e.target.closest("[data-do]");if(!b)return;const card=b.closest("article"),id=card?.dataset.id;
  const A={like:()=>like(card,b),cm:()=>openComments(card),del:()=>delPost(card),
   reply:()=>{const f=b.closest(".cms").querySelector("form");f.dataset.to=b.dataset.p;f.querySelector("input").placeholder="اكتب رداً...";f.querySelector("input").focus()},
   delcm:()=>delComment(card,b.dataset.c)};
  A[b.dataset.do]?.();
});
V.addEventListener("submit",e=>{
  const f=e.target.closest(".cmf");if(!f)return;e.preventDefault();
  const card=f.closest("article"),inp=f.querySelector("input"),text=inp.value.trim();if(!text)return;
  guard(f.querySelector("button"),async()=>{
    const pid=card.dataset.id,r=doc(collection(db,"posts",pid,"comments")),b=writeBatch(db);
    b.set(r,{authorId:me.uid,text,parentId:f.dataset.to||null,createdAt:serverTimestamp()});
    b.update(doc(db,"posts",pid),{commentsCount:increment(1)});await b.commit();
    inp.value="";f.dataset.to="";inp.placeholder="اكتب تعليقاً...";bump(card,"cm",1);loadComments(card);
  });
});
function bump(card,k,n){const el=card.querySelector(`[data-do=${k}] b`);el.textContent=Math.max(0,(+el.textContent||0)+n)}

function like(card,btn){guard(btn,async()=>{
  const id=card.dataset.id,on=btn.classList.contains("on"),r=doc(db,"posts",id,"reactions",me.uid),b=writeBatch(db);
  if(on)b.delete(r);else b.set(r,{type:"like",userId:me.uid,createdAt:serverTimestamp()});
  b.update(doc(db,"posts",id),{likes:increment(on?-1:1)});await b.commit();
  btn.classList.toggle("on",!on);bump(card,"like",on?-1:1);
})}
function delPost(card){if(!confirm("هل تريد حذف هذا المنشور؟"))return;guard(null,async()=>{
  const id=card.dataset.id,s=await getDoc(doc(db,"posts",id)),p=s.data()?.imagePath;
  await deleteDoc(doc(db,"posts",id));if(p)deleteObject(ref(storage,p)).catch(()=>{});card.remove();toast("تم حذف المنشور");
})}

// ===== التعليقات والردود =====
async function openComments(card){const box=card.querySelector(".cms");box.classList.toggle("hide");if(!box.classList.contains("hide"))loadComments(card)}
async function loadComments(card){
  const box=card.querySelector(".cms"),pid=card.dataset.id;
  const snap=await getDocs(query(collection(db,"posts",pid,"comments"),orderBy("createdAt","asc"),limit(200)));
  const all=snap.docs.map(s=>({id:s.id,...s.data({serverTimestamps:"estimate"})}));
  const roots=all.filter(c=>!c.parentId),kids=p=>all.filter(c=>c.parentId===p);
  const names=await Promise.all([...new Set(all.map(c=>c.authorId))].map(async u=>[u,await prof(u)])),P=Object.fromEntries(names);
  const one=(c,rp)=>{const p=P[c.authorId]||{name:"مستخدم"},n=kids(c.id).length,mine=c.authorId===me.uid||card.dataset.owner===me.uid;
    return `<div class="cm ${rp?"rp":""}"><div class="row" style="align-items:flex-start">${av(p)}<div class="b"><b data-go="${esc(c.authorId)}" class="nm">${esc(p.name)}</b> <span class="tm">${ago(c.createdAt)}</span>
    <div style="white-space:pre-wrap">${esc(c.text)}</div>
    ${rp?"":`<button class="lk" data-do="reply" data-p="${c.id}">رد${n?` (${n})`:""}</button>`}
    ${mine&&!n?`<button class="lk" style="color:#b3402e" data-do="delcm" data-c="${c.id}">حذف</button>`:""}</div></div></div>`};
  box.innerHTML=(roots.map(c=>one(c)+kids(c.id).map(k=>one(k,1)).join("")).join("")||'<div class="empty">كن أول من يعلّق.</div>')+
    `<form class="send cmf"><input maxlength="500" placeholder="اكتب تعليقاً..."><button>إرسال</button></form>`;
}
function delComment(card,cid){guard(null,async()=>{
  const pid=card.dataset.id,b=writeBatch(db);b.delete(doc(db,"posts",pid,"comments",cid));
  b.update(doc(db,"posts",pid),{commentsCount:increment(-1)});await b.commit();bump(card,"cm",-1);loadComments(card);
})}

// ===== الصفحات =====
async function home(more){
  if(!more){cursor=null;V.innerHTML='<div id="feed"></div><button id="more" class="btn sm hide" style="margin:auto;display:flex">عرض المزيد</button>';$("#more").onclick=()=>home(true)}
  const q=query(collection(db,"posts"),orderBy("createdAt","desc"),...(cursor?[startAfter(cursor)]:[]),limit(10));
  const s=await getDocs(q);cursor=s.docs.at(-1)||cursor;
  showPosts($("#feed"),s.docs.map(d=>[d.id,d.data({serverTimestamps:"estimate"})]),more);
  $("#more").classList.toggle("hide",s.size<10);
}
async function search(){
  V.innerHTML=`<input id="q" type="search" placeholder="ابحث عن منتج أو بائع..."><div class="chips" id="cc"><button class="on" data-c="">الكل</button>${Object.entries(CATS).map(([k,v])=>`<button data-c="${k}">${v}</button>`).join("")}</div><div id="res"></div>`;
  if(!corpus.length){const s=await getDocs(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(80)));corpus=s.docs.map(d=>[d.id,d.data({serverTimestamps:"estimate"})])}
  let cat="";const nz=t=>String(t||"").toLowerCase().replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
  const names=new Map(await Promise.all([...new Set(corpus.map(([,d])=>d.authorId))].map(async u=>[u,nz((await prof(u)).name)])));
  const run=()=>{const q=nz($("#q").value);
    showPosts($("#res"),corpus.filter(([,d])=>(!cat||d.category===cat)&&(!q||[d.name,d.content,d.description,CATS[d.category],names.get(d.authorId)].some(x=>nz(x).includes(q)))).slice(0,30));};
  $("#q").oninput=run;$("#cc").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;[...$("#cc").children].forEach(x=>x.classList.toggle("on",x===b));run()};
  run();
}
function add(){
  if(me.role!=="seller"){V.innerHTML=`<div class="card empty">النشر متاح لحسابات البائعين.<br><br><a class="btn sm" style="background:var(--field);color:#fff" href="#me">غيّر نوع حسابك من الملف الشخصي</a></div>`;return}
  V.innerHTML=`<form class="card" id="pf"><b>منتج جديد</b>
   <label>صورة المنتج</label><input type="file" id="pi" accept="image/*" required>
   <label>اسم المنتج</label><input id="pn" maxlength="100" required placeholder="مثال: طماطم طازجة">
   <label>التصنيف</label><select id="pc" required>${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
   <label>السعر (دج)</label><input id="pp" type="number" min="1" step="any" required>
   <label>الوصف</label><textarea id="pd" rows="4" maxlength="2000"></textarea>
   <button class="btn" style="margin-top:14px;background:var(--field);color:#fff">نشر المنتج</button></form>`;
  $("#pf").onsubmit=e=>{e.preventDefault();guard($("#pf button"),async()=>{
    const path=`posts/${me.uid}/${Date.now()}.jpg`,url=await upload($("#pi").files[0],path,1280);
    await setDoc(doc(collection(db,"posts")),{authorId:me.uid,authorName:me.name,authorRole:"seller",name:$("#pn").value.trim(),category:$("#pc").value,
      price:Number($("#pp").value),content:$("#pd").value.trim(),imageURL:url,imagePath:path,likes:0,dislikes:0,commentsCount:0,createdAt:serverTimestamp()});
    toast("تم نشر المنتج");corpus=[];location.hash="home";
  })};
}
async function profile(uid){
  const own=uid===me.uid,p=await prof(uid);
  if(!p.uid&&!own){V.innerHTML='<div class="empty">هذا المستخدم غير موجود.</div>';return}
  const s=await getDocs(query(collection(db,"posts"),where("authorId","==",uid),limit(50)));
  const list=s.docs.map(d=>[d.id,d.data({serverTimestamps:"estimate"})]).sort((a,b)=>(b[1].createdAt?.seconds||0)-(a[1].createdAt?.seconds||0));
  const since=p.createdAt?.toDate?p.createdAt.toDate().toLocaleDateString("ar-DZ",{year:"numeric",month:"long"}):"";
  V.innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div class="cover"></div><div style="padding:0 16px 16px;text-align:center">
   <div style="margin-top:-48px">${av(p,"xl")}</div><h2>${esc(p.name)}</h2>
   <div class="tm">${p.role==="seller"?"بائع":"مشتري"}${since?` • عضو منذ ${since}`:""} • ${list.length} منشور</div>
   ${own?`<button class="btn sm" id="ed" style="background:var(--field);color:#fff;margin-top:10px">تعديل الحساب</button>`:""}</div></div>
   <div id="edit" class="hide"></div><div id="pp"></div>`;
  showPosts($("#pp"),list);
  if(own)$("#ed").onclick=()=>{const b=$("#edit");b.classList.toggle("hide");if(b.innerHTML)return;
    b.innerHTML=`<form class="card" id="ef"><b>إعدادات الحساب</b>
     <label>صورة الحساب</label><input type="file" id="ei" accept="image/*">
     <label>الاسم</label><input id="en" maxlength="60" required value="${esc(p.name)}">
     <label>نوع الحساب</label><select id="er"><option value="buyer">مشتري</option><option value="seller">بائع</option></select>
     <button class="btn" style="margin-top:14px;background:var(--field);color:#fff">حفظ التغييرات</button>
     <button type="button" id="lo" class="btn alt" style="background:#fbe9e5;color:#b3402e">تسجيل الخروج</button></form>`;
    $("#er").value=p.role||"buyer";
    $("#lo").onclick=()=>signOut(auth).then(()=>location.hash="");
    $("#ef").onsubmit=e=>{e.preventDefault();guard($("#ef button"),async()=>{
      const f=$("#ei").files[0],name=$("#en").value.trim(),role=$("#er").value;
      const photoURL=f?await upload(f,`avatars/${me.uid}/a_${Date.now()}.jpg`,400):(p.photoURL||"");
      await updateDoc(doc(db,"profiles",me.uid),{name,photoURL,role,updatedAt:serverTimestamp()});
      updateDoc(doc(db,"users",me.uid),{name,photoURL,role,roleChosen:true,updatedAt:serverTimestamp()}).catch(()=>{});
      updateProfile(auth.currentUser,{displayName:name,photoURL}).catch(()=>{});
      me={...me,name,photoURL,role};cache.set(me.uid,Promise.resolve(me));toast("تم حفظ التغييرات");profile(me.uid);
    })};
  };
}

// ===== التوجيه والشريط السفلي =====
const NAV=[["home","الرئيسية","home"],["search","البحث","search"],["add","نشر","plus"],["me","حسابي","user"]];
function route(){
  if(!me)return;const h=location.hash.slice(1)||"home",[k,arg]=h.split("/");
  $("#nav").innerHTML=NAV.map(([id,l,i])=>`<button data-r="${id}" class="${id==="add"?"add":""} ${(k===id||(k==="u"&&id==="me"&&arg===me.uid))?"on":""}" aria-label="${l}">${ic(i)}${id==="add"?"":l}</button>`).join("");
  V.classList.remove("view");void V.offsetWidth;V.classList.add("view");scrollTo(0,0);
  V.innerHTML='<div class="empty">جارٍ التحميل...</div>';
  const run={home:()=>home(),search,add,me:()=>profile(me.uid),u:()=>profile(arg)}[k]||(()=>home());
  Promise.resolve(run()).catch(e=>{console.error(e);V.innerHTML=`<div class="empty">${navigator.onLine?"تعذّر تحميل الصفحة.":"لا يوجد اتصال بالإنترنت."}</div>`});
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;const r=b.dataset.r;location.hash===("#"+r)?route():location.hash=r});
addEventListener("hashchange",route);
addEventListener("offline",()=>toast("انقطع الاتصال بالإنترنت"));
</script>
</body>
</html>
