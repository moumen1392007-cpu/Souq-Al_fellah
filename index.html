<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق الفلاح</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6f3;
    color: #26352b;
    padding-bottom: 85px;
}

header {
    background: #16834a;
    color: white;
    padding: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    font-size: 21px;
}

header button {
    background: white;
    color: #16834a;
    border: none;
    padding: 9px 13px;
    border-radius: 9px;
}

.welcome {
    padding: 35px 20px;
    text-align: center;
    background: white;
    margin: 15px;
    border-radius: 15px;
}

.welcome h2 {
    color: #16834a;
    margin-bottom: 12px;
}

.welcome button {
    background: #16834a;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 9px;
    margin: 10px 5px;
    cursor: pointer;
}

.page {
    display: none;
    padding: 15px;
}

.page.active {
    display: block;
}

.page-title {
    font-size: 21px;
    margin-bottom: 17px;
    color: #16834a;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px #0000000b;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #d9f0e1;
    color: #16834a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.role-label {
    font-size: 11px;
    color: #16834a;
    margin-top: 4px;
}

.post-content {
    margin: 15px 0;
    line-height: 1.7;
    white-space: pre-wrap;
}

.post-image {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 10px;
}

.post-actions {
    display: flex;
    justify-content: space-around;
    border-top: 1px solid #eee;
    padding-top: 12px;
    margin-top: 12px;
}

.post-actions button {
    border: none;
    background: none;
    font-size: 14px;
    color: #555;
    cursor: pointer;
}

.post-actions button.selected {
    color: #16834a;
    font-weight: bold;
}

.comment-area {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin: 7px 0;
    font-family: inherit;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

.primary {
    background: #16834a;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 9px;
    width: 100%;
    cursor: pointer;
    margin-top: 8px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    height: 70px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -3px 15px #00000012;
    z-index: 1000;
}

.nav-item {
    border: none;
    background: none;
    color: #888;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    cursor: pointer;
    height: 60px;
    justify-content: center;
    position: relative;
    flex: 1;
}

.nav-icon {
    font-size: 22px;
}

.nav-item.active {
    color: #16834a;
}

.nav-item.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 28px;
    height: 4px;
    background: #16834a;
    border-radius: 5px;
}

.nav-item.add {
    color: white;
}

.nav-item.add .nav-icon {
    background: #16834a;
    width: 45px;
    height: 45px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px 10px;
}

#statusMessage {
    text-align: center;
    padding: 10px;
    color: #16834a;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.product-card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 9px;
}

.product-card h4 {
    margin: 8px 0;
}

.product-card p {
    font-size: 13px;
    margin-top: 5px;
}

.comment {
    background: #f3f6f3;
    padding: 10px;
    border-radius: 9px;
    margin-top: 8px;
    font-size: 13px;
}

@media(min-width:700px) {
    .page {
        max-width: 700px;
        margin: auto;
    }
}
</style>
</head>

<body>

<header>
    <h2>🌱 سوق الفلاح</h2>
    <button id="logoutButton">خروج</button>
</header>

<!-- شاشة الترحيب -->
<section id="welcomeScreen" class="welcome" style="display:none">
    <h2>مرحباً بك في سوق الفلاح</h2>
    <p>منصة تجمع الفلاحين والمشترين</p>
    <button onclick="location.href='register.html'">إنشاء حساب</button>
    <button onclick="location.href='login.html'">تسجيل الدخول</button>
</section>

<div id="marketScreen" style="display:none">

    <!-- الصفحة الرئيسية -->
    <section id="homePage" class="page active">
        <h3 class="page-title">🌾 آخر المنشورات</h3>

        <div class="card">
            <input id="searchInput" placeholder="ابحث عن منتج...">
            <select id="categoryFilter">
                <option value="">جميع التصنيفات</option>
                <option value="خضر">خضر</option>
                <option value="فواكه">فواكه</option>
                <option value="حبوب">حبوب</option>
            </select>
        </div>

        <div id="statusMessage"></div>

        <h3 style="margin:15px 0">📰 منشورات المجتمع</h3>
        <div id="postsContainer">
            <p class="empty">جارٍ تحميل المنشورات...</p>
        </div>

        <h3 style="margin:20px 0">🛒 المنتجات والأسعار</h3>
        <div id="productsGrid" class="product-grid"></div>
    </section>

    <!-- الملف الشخصي -->
    <section id="profilePage" class="page">
        <h3 class="page-title">👤 الملف الشخصي</h3>
        <div class="card">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div>
                    <h3 id="profileName">المستخدم</h3>
                    <p id="profileRole" class="role-label"></p>
                </div>
            </div>
            <hr style="margin:15px 0;border:0;border-top:1px solid #eee">
            <p id="profileEmail"></p>
            <button class="primary" onclick="location.href='choose-role.html'">
                🔄 تغيير نوع الحساب
            </button>
        </div>
    </section>

    <!-- الإشعارات -->
    <section id="notificationsPage" class="page">
        <h3 class="page-title">🔔 الإشعارات</h3>
        <div class="card">
            <p class="empty">لا توجد إشعارات حالياً.</p>
        </div>
    </section>

    <!-- إضافة منشور -->
    <section id="createPage" class="page">
        <h3 class="page-title">➕ إنشاء منشور</h3>

        <div class="card">
            <textarea id="postText" placeholder="ماذا تريد أن تشارك مع المجتمع؟"></textarea>

            <label>إضافة صورة (اختياري)</label>
            <input type="file" id="postImage" accept="image/*">

            <button class="primary" id="publishPost">
                نشر المنشور
            </button>

            <p id="postMessage"></p>
        </div>
    </section>

    <!-- الرسائل -->
    <section id="messagesPage" class="page">
        <h3 class="page-title">💬 الرسائل</h3>
        <div class="card">
            <p class="empty">لا توجد محادثات حالياً.</p>
        </div>
    </section>

    <!-- الإعدادات -->
    <section id="settingsPage" class="page">
        <h3 class="page-title">⚙️ الإعدادات</h3>

        <div class="card">
            <button class="primary" onclick="location.href='choose-role.html'">
                تغيير نوع الحساب
            </button>

            <button class="primary" id="settingsLogout">
                تسجيل الخروج
            </button>
        </div>
    </section>

</div>

<!-- شريط التنقل -->
<nav class="bottom-nav" id="bottomNav" style="display:none">

    <button class="nav-item active" data-page="profilePage">
        <span class="nav-icon">👤</span>
        <span>حسابي</span>
    </button>

    <button class="nav-item" data-page="notificationsPage">
        <span class="nav-icon">🔔</span>
        <span>الإشعارات</span>
    </button>

    <button class="nav-item add" data-page="createPage">
        <span class="nav-icon">+</span>
        <span>نشر</span>
    </button>

    <button class="nav-item" data-page="messagesPage">
        <span class="nav-icon">💬</span>
        <span>الرسائل</span>
    </button>

    <button class="nav-item" data-page="settingsPage">
        <span class="nav-icon">⚙️</span>
        <span>الإعدادات</span>
    </button>

</nav>

<script type="module">
import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    serverTimestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import { auth, db, storage } from "./js/firebase.js";

const welcomeScreen = document.getElementById("welcomeScreen");
const marketScreen = document.getElementById("marketScreen");
const bottomNav = document.getElementById("bottomNav");

let currentUser = null;
let currentUserData = null;

const pages = document.querySelectorAll(".page");
const navItems = document.querySelectorAll(".nav-item");

// التنقل بين الأقسام
navItems.forEach(button => {
    button.addEventListener("click", () => {
        const target = button.dataset.page;

        pages.forEach(page => page.classList.remove("active"));
        document.getElementById(target).classList.add("active");

        navItems.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
    });
});

// التحقق من تسجيل الدخول
onAuthStateChanged(auth, async user => {
    if (!user) {
        welcomeScreen.style.display = "block";
        marketScreen.style.display = "none";
        bottomNav.style.display = "none";
        return;
    }

    currentUser = user;

    try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        currentUserData = userDoc.exists() ? userDoc.data() : {};

        welcomeScreen.style.display = "none";
        marketScreen.style.display = "block";
        bottomNav.style.display = "flex";

        document.getElementById("profileName").textContent =
            currentUserData.name || user.displayName || "مستخدم";

        document.getElementById("profileRole").textContent =
            currentUserData.role === "seller" ? "بائع" : "مشتري";

        document.getElementById("profileEmail").textContent =
            user.email || "";

        loadPosts();
        loadProducts();

    } catch (error) {
        console.error(error);
        document.getElementById("statusMessage").textContent =
            "حدث خطأ في تحميل الحساب.";
    }
});

// تسجيل الخروج
async function logout() {
    await signOut(auth);
    location.href = "index.html";
}

document.getElementById("logoutButton").onclick = logout;
document.getElementById("settingsLogout").onclick = logout;

// نشر منشور
document.getElementById("publishPost").addEventListener("click", async () => {
    const text = document.getElementById("postText").value.trim();
    const imageFile = document.getElementById("postImage").files[0];
    const message = document.getElementById("postMessage");

    if (!text && !imageFile) {
        message.textContent = "اكتب شيئاً أو اختر صورة.";
        return;
    }

    try {
        message.textContent = "جارٍ النشر...";

        let imageUrl = "";

        if (imageFile) {
            if (!imageFile.type.startsWith("image/") ||
                imageFile.size > 5 * 1024 * 1024) {
                message.textContent = "الصورة يجب أن تكون أقل من 5 ميغابايت.";
                return;
            }

            const imageRef = ref(
                storage,
                `posts/${currentUser.uid}/${Date.now()}_${imageFile.name}`
            );

            await uploadBytes(imageRef, imageFile);
            imageUrl = await getDownloadURL(imageRef);
        }

        await addDoc(collection(db, "posts"), {
            authorId: currentUser.uid,
            authorName: currentUserData.name ||
                        currentUser.displayName || "مستخدم",
            authorRole: currentUserData.role || "buyer",
            content: text,
            image: imageUrl,
            createdAt: serverTimestamp()
        });

        document.getElementById("postText").value = "";
        document.getElementById("postImage").value = "";
        message.textContent = "تم نشر المنشور بنجاح!";

        showPage("homePage");

    } catch (error) {
        console.error(error);
        message.textContent = "فشل النشر: " + error.message;
    }
});

// تغيير الصفحة
function showPage(id) {
    pages.forEach(page => page.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    navItems.forEach(item => {
        item.classList.toggle("active", item.dataset.page === id);
    });
}

// عرض المنشورات
function loadPosts() {
    const container = document.getElementById("postsContainer");

    const postsQuery = query(
        collection(db, "posts"),
        orderBy("createdAt", "desc")
    );

    onSnapshot(postsQuery, snapshot => {
        container.innerHTML = "";

        if (snapshot.empty) {
            container.innerHTML =
                '<p class="empty">لا توجد منشورات بعد. كن أول من ينشر!</p>';
            return;
        }

        snapshot.forEach(postDoc => {
            const post = postDoc.data();
            const postId = postDoc.id;

            const card = document.createElement("div");
            card.className = "card";

            const profile = document.createElement("div");
            profile.className = "profile-header";

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent = "👤";

            const info = document.createElement("div");

            const name = document.createElement("strong");
            name.textContent = post.authorName || "مستخدم";

            const role = document.createElement("p");
            role.className = "role-label";
            role.textContent =
                post.authorRole === "seller" ? "بائع" : "مشتري";

            info.append(name, role);
            profile.append(avatar, info);

            const content = document.createElement("p");
            content.className = "post-content";
            content.textContent = post.content || "";

            card.append(profile, content);

            if (post.image) {
                const image = document.createElement("img");
                image.src = post.image;
                image.className = "post-image";
                card.append(image);
            }

            const actions = document.createElement("div");
            actions.className = "post-actions";

            const like = document.createElement("button");
            like.textContent = "👍 إعجاب";

            const dislike = document.createElement("button");
            dislike.textContent = "👎 لم يعجبني";

            const commentButton = document.createElement("button");
            commentButton.textContent = "💬 تعليق";

            actions.append(like, dislike, commentButton);
            card.append(actions);

            const comments = document.createElement("div");
            const commentInput = document.createElement("input");
            commentInput.placeholder = "اكتب تعليقاً...";

            const sendComment = document.createElement("button");
            sendComment.className = "primary";
            sendComment.textContent = "إرسال التعليق";

            const commentsList = document.createElement("div");

            comments.append(commentInput, sendComment, commentsList);
            comments.style.display = "none";
            card.append(comments);

            commentButton.onclick = () => {
                comments.style.display =
                    comments.style.display === "none" ? "block" : "none";
            };

            like.onclick = () => react(postId, "like");
            dislike.onclick = () => react(postId, "dislike");

            sendComment.onclick = async () => {
                const text = commentInput.value.trim();
                if (!text) return;

                try {
                    await addDoc(
                        collection(db, "posts", postId, "comments"),
                        {
                            authorId: currentUser.uid,
                            authorName: currentUserData.name ||
                                        currentUser.displayName || "مستخدم",
                            text,
                            createdAt: serverTimestamp()
                        }
                    );

                    commentInput.value = "";
                } catch (error) {
                    alert("تعذر إرسال التعليق: " + error.message);
                }
            };

            onSnapshot(
                collection(db, "posts", postId, "comments"),
                commentSnapshot => {
                    commentsList.innerHTML = "";

                    commentSnapshot.forEach(commentDoc => {
                        const comment = commentDoc.data();
                        const item = document.createElement("div");
                        item.className = "comment";

                        const strong = document.createElement("strong");
                        strong.textContent = comment.authorName || "مستخدم";

                        const text = document.createElement("p");
                        text.textContent = comment.text;

                        item.append(strong, text);
                        commentsList.append(item);
                    });
                }
            );

            card.append(document.createElement("hr"));
            container.append(card);
        });
    }, error => {
        console.error(error);
        container.innerHTML =
            '<p class="empty">تعذر تحميل المنشورات.</p>';
    });
}

// الإعجاب وعدم الإعجاب
async function react(postId, type) {
    try {
        const reactionRef = doc(
            db,
            "posts",
            postId,
            "reactions",
            currentUser.uid
        );

        const existing = await getDoc(reactionRef);

        if (existing.exists() && existing.data().type === type) {
            await deleteDoc(reactionRef);
        } else {
            await setDoc(reactionRef, {
                type,
                userId: currentUser.uid
            });
        }
    } catch (error) {
        alert("تعذر تسجيل التفاعل: " + error.message);
    }
}

// عرض المنتجات
async function loadProducts() {
    const grid = document.getElementById("productsGrid");

    try {
        const snapshot = await getDocs(collection(db, "products"));
        grid.innerHTML = "";

        snapshot.forEach(productDoc => {
            const product = productDoc.data();

            const card = document.createElement("div");
            card.className = "card product-card";

            if (product.image) {
                const image = document.createElement("img");
                image.src = product.image;
                card.append(image);
            }

            const title = document.createElement("h4");
            title.textContent = product.name || "منتج";

            const price = document.createElement("p");
            price.textContent =
                `${product.price} دج / ${product.unit || "وحدة"}`;

            const seller = document.createElement("p");
            seller.textContent =
                `البائع: ${product.sellerName || "بائع"}`;

            const wilaya = document.createElement("p");
            wilaya.textContent = product.wilaya || "";

            card.append(title, price, seller, wilaya);
            grid.append(card);
        });

    } catch (error) {
        console.error(error);
        grid.innerHTML =
            '<p class="empty">تعذر تحميل المنتجات.</p>';
    }
}
</script>

</body>
</html>
