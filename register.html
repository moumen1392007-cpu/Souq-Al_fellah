<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | سوق الفلاح</title>
<link rel="stylesheet" href="css/style.css"><style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;
background:linear-gradient(135deg,#edf7ee,#f8fbf6);
min-height:100vh;display:flex;flex-direction:column;
}
.header{background:#fff;padding:16px 5%;box-shadow:0 2px 12px #0000000a}
.navbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#245b36;text-decoration:none}
.logo span{color:#79a84a}
.home-link{color:#27633b;text-decoration:none;font-weight:bold}
.auth-main{flex:1;display:flex;justify-content:center;align-items:center;padding:30px 15px}
.auth-card{
width:100%;max-width:470px;background:#fff;padding:32px 27px;
border-radius:22px;box-shadow:0 12px 40px #245b3614;
}
.brand-icon{
width:62px;height:62px;border-radius:19px;background:#eaf5e8;
display:flex;align-items:center;justify-content:center;
font-size:32px;margin:0 auto 13px;
}
.auth-card h1{text-align:center;color:#234d31;font-size:24px;margin:10px 0}
.subtitle{text-align:center;color:#849087;font-size:14px;line-height:1.8;margin-bottom:22px}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:7px;color:#344c3a;font-weight:bold;font-size:14px}
.form-group input,.form-group select{
width:100%;padding:14px;border:1px solid #dce7dc;border-radius:12px;
background:#fbfdfb;font-size:15px;outline:none;transition:.2s;
}
.form-group input:focus,.form-group select:focus{
border-color:#4b985e;box-shadow:0 0 0 3px #4b985e18
}
.main-btn{
width:100%;border:0;border-radius:12px;padding:15px;
background:#287443;color:white;font-size:16px;font-weight:bold;
cursor:pointer;transition:.2s;margin-top:7px;
}
.main-btn:hover{background:#1d5e35}
.google-btn{
width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
padding:14px;border:1px solid #dce5dc;border-radius:12px;
background:#fff;color:#333;font-size:15px;font-weight:bold;cursor:pointer;
}
.google-btn:hover{background:#f7faf7}
.google-btn svg{width:21px;height:21px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#a0aaa0;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;background:#e6ece6;flex:1}
.form-link{text-align:center;color:#778078;font-size:14px;margin-top:22px}
.form-link a{color:#287443;text-decoration:none;font-weight:bold}
.message{display:none;margin:12px 0;padding:11px;border-radius:9px;background:#f2f8f1;text-align:center;font-size:14px}
.footer{text-align:center;padding:18px;color:#89958a;font-size:13px}
@media(max-width:480px){
.auth-card{padding:25px 19px;border-radius:18px}
.auth-main{padding:20px 13px}
}
</style></head><body><header class="header">
<div class="navbar">
<a href="index.html" class="logo">سوق <span>الفلاح</span> 🌿</a>
<a href="index.html" class="home-link">الرئيسية</a>
</div>
</header><main class="auth-main">

<p class="subtitle">أنشئ حسابك وابدأ رحلتك معنا في عالم المنتجات الفلاحية.</p><button type="button" id="googleRegister" class="google-btn">

<path fill="#FBBC05" d="M10.4 28.7c-.6-1.4-.9-3-.9-4.7s.3-3.3.9-4.7l-7.8-6.1C.9 16.7 0 20.2 0 24s.9 7.3 2.6 10.8l7.8-6.1z"/>
<path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.4l-7.3-5.7c-2 1.3-4.6 2.1-7.9 2.1-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 43 14.6 48 24 48z"/>
</svg>
التسجيل باستخدام Google

</div><div class="form-group">
<label for="email">البريد الإلكتروني</label>
<input type="email" id="email" placeholder="example@email.com" required>
</div><div class="form-group">

<input type="password" id="password" placeholder="6 أحرف على الأقل" minlength="6" required>
</div><div id="authMessage" class="message"></div><button type="submit" class="main-btn">إنشاء حساب جديد</button>

</form><p class="form-link">

<a href="login.html">تسجيل الدخول</a>
</p></div>
</main><footer class="footer">

</html>
